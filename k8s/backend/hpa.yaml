apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: backend-hpa
  namespace: personal-project

spec:

  scaleTargetRef:

    apiVersion: apps/v1
    kind: Deployment
    name: user-app-deployment

  minReplicas: 2

  maxReplicas: 5

  behavior:

    scaleDown:

      stabilizationWindowSeconds: 300

    scaleUp:

      stabilizationWindowSeconds: 30

  metrics:

  - type: Resource

    resource:

      name: cpu

      target:

        type: Utilization

        averageUtilization: 60