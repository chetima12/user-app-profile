apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-app
  namespace: personal-project
  labels:
    app: user-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: user-app
  template:
    metadata:
      labels:
        app: user-app
    spec:
      containers:
        - name: user-app
          image: user-profile-app:v1
          ports:
            - containerPort: 3000

          env:
            # Service DNS name inside the cluster
            - name: DB_HOST
              value: "postgresql-headless.database.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            # Pull database credentials directly from existing Secret/ConfigMap
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          # Corrected spelling, alignment, and indentation
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"