<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>👤 Edit User Profile</h1>
        
        <div class="profile-wrapper">
            <!-- Avatar Section -->
            <div class="avatar-section">
                <img id="avatarPreview" src="" alt="Avatar">
                <button onclick="generateAvatar()" class="btn-secondary">🎨 Generate New Avatar</button>
            </div>

            <!-- Profile Form -->
            <form id="profileForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="bio">Bio</label>
                    <textarea id="bio" rows="4" placeholder="Tell us about yourself..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">💾 Save Changes</button>
                    <button type="button" onclick="loadProfile()" class="btn-secondary">🔄 Reset</button>
                </div>
            </form>

            <!-- Status Message -->
            <div id="statusMessage" class="status-message hidden"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
